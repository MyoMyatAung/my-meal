<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping list · My Meal</title>

    <script>
      (function () {
        try {
          if (localStorage.getItem("theme") !== "light") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  </head>
  <body>
    <div class="app">
      <div class="topbar">
        <span class="topbar__brand">My Meal</span>
        <button type="button" class="topbar__menu" data-nav-open aria-expanded="false" aria-controls="primary-nav" aria-label="Open navigation">
          <i data-lucide="menu"></i>
          <span>Menu</span>
        </button>
      </div>

      <div class="nav-backdrop" data-nav-close hidden></div>

      <aside class="sidebar" id="primary-nav" aria-label="Primary">
        <div class="sidebar__brand">My Meal</div>
        <nav class="sidebar__nav">
          <a href="index.html">
            <i data-lucide="layout-dashboard"></i><span>Dashboard</span>
          </a>
          <a href="plan-view.html">
            <i data-lucide="calendar-days"></i><span>Plan</span>
          </a>
          <a href="dishes.html">
            <i data-lucide="utensils"></i><span>Dishes</span>
          </a>
          <a href="shopping-list.html" aria-current="page">
            <i data-lucide="shopping-cart"></i><span>Shopping list</span>
          </a>
          <a href="plan-history.html">
            <i data-lucide="history"></i><span>History</span>
          </a>
        </nav>

        <div class="sidebar__spacer"></div>
        <hr class="sidebar__divider" />

        <div class="sidebar__footer">
          <button type="button" class="sidebar__theme" data-theme-toggle aria-label="Toggle theme">
            <i data-lucide="sun" data-theme-icon-sun hidden></i>
            <i data-lucide="moon" data-theme-icon-moon></i>
            <span data-theme-label>Theme</span>
          </button>
          <div class="sidebar__user">
            <span class="avatar">A</span>
            <span class="sidebar__user-name">Alex Tran</span>
          </div>
        </div>
      </aside>

      <main class="main">
        <div class="main__inner">
          <header class="row between items-start mb-24">
            <h1>Shopping list</h1>
            <span class="text-meta" id="counter">5 of 14 checked</span>
          </header>

          <div class="card" id="shopping-list">
            <label class="check-row is-checked">
              <input type="checkbox" checked />
              <span>Chicken</span>
            </label>
            <label class="check-row is-checked">
              <input type="checkbox" checked />
              <span>Potato</span>
            </label>
            <label class="check-row is-checked">
              <input type="checkbox" checked />
              <span>Tomato</span>
            </label>
            <label class="check-row is-checked">
              <input type="checkbox" checked />
              <span>Chili</span>
            </label>
            <label class="check-row is-checked">
              <input type="checkbox" checked />
              <span>Mushroom</span>
            </label>
            <label class="check-row">
              <input type="checkbox" />
              <span>Spinach</span>
            </label>
            <label class="check-row">
              <input type="checkbox" />
              <span>Garlic</span>
            </label>
            <label class="check-row">
              <input type="checkbox" />
              <span>Egg</span>
            </label>
            <label class="check-row">
              <input type="checkbox" />
              <span>Avocado</span>
            </label>
            <label class="check-row">
              <input type="checkbox" />
              <span>Bread</span>
            </label>
            <label class="check-row">
              <input type="checkbox" />
              <span>Rice</span>
            </label>
            <label class="check-row">
              <input type="checkbox" />
              <span>Ginger</span>
            </label>
            <label class="check-row">
              <input type="checkbox" />
              <span>Soy sauce</span>
            </label>
            <label class="check-row">
              <input type="checkbox" />
              <span>Fish</span>
            </label>
          </div>
        </div>
      </main>
    </div>

    <script src="script.js"></script>
    <script>
      (function () {
        var list = document.getElementById("shopping-list");
        var counter = document.getElementById("counter");
        var total = 14;

        function updateCounter() {
          var checked = list.querySelectorAll("input:checked").length;
          counter.textContent = checked + " of " + total + " checked";
        }

        list.addEventListener("change", function (e) {
          if (e.target.type !== "checkbox") return;
          var row = e.target.closest(".check-row");
          if (row) {
            row.classList.toggle("is-checked", e.target.checked);
          }
          updateCounter();
        });

        updateCounter();
      })();
    </script>
  </body>
</html>
