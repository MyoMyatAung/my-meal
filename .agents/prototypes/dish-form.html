<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dish form · My Meal</title>

    <script>
      (function () {
        try {
          if (localStorage.getItem("theme") !== "light") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  </head>
  <body>
    <div class="app">
      <div class="topbar">
        <span class="topbar__brand">My Meal</span>
        <button type="button" class="topbar__menu" data-nav-open aria-expanded="false" aria-controls="primary-nav" aria-label="Open navigation">
          <i data-lucide="menu"></i>
          <span>Menu</span>
        </button>
      </div>

      <div class="nav-backdrop" data-nav-close hidden></div>

      <aside class="sidebar" id="primary-nav" aria-label="Primary">
        <div class="sidebar__brand">My Meal</div>
        <nav class="sidebar__nav">
          <a href="index.html">
            <i data-lucide="layout-dashboard"></i><span>Dashboard</span>
          </a>
          <a href="plan-view.html">
            <i data-lucide="calendar-days"></i><span>Plan</span>
          </a>
          <a href="dishes.html" aria-current="page">
            <i data-lucide="utensils"></i><span>Dishes</span>
          </a>
          <a href="shopping-list.html">
            <i data-lucide="shopping-cart"></i><span>Shopping list</span>
          </a>
          <a href="plan-history.html">
            <i data-lucide="history"></i><span>History</span>
          </a>
        </nav>

        <div class="sidebar__spacer"></div>
        <hr class="sidebar__divider" />

        <div class="sidebar__footer">
          <button type="button" class="sidebar__theme" data-theme-toggle aria-label="Toggle theme">
            <i data-lucide="sun" data-theme-icon-sun hidden></i>
            <i data-lucide="moon" data-theme-icon-moon></i>
            <span data-theme-label>Theme</span>
          </button>
          <div class="sidebar__user">
            <span class="avatar">A</span>
            <span class="sidebar__user-name">Alex Tran</span>
          </div>
        </div>
      </aside>

      <main class="main">
        <div class="main__inner">
          <a class="link-arrow mb-16" href="dishes.html"><i data-lucide="chevron-left" style="width:14px;height:14px;vertical-align:middle;"></i> Dish library</a>

          <h1 id="form-heading" class="mb-24">Add dish</h1>

          <div class="card">
            <div class="stack gap-16">
              <div>
                <label class="text-micro" for="dish-name" style="display:block;margin-bottom:4px;">Name</label>
                <input class="input" type="text" id="dish-name" placeholder="Dish name" />
              </div>

              <div>
                <label class="text-micro" for="dish-category" style="display:block;margin-bottom:4px;">Category</label>
                <select class="select" id="dish-category">
                  <option>Main</option>
                  <option>Side</option>
                  <option>Soup</option>
                  <option>Snack</option>
                  <option>Other</option>
                </select>
              </div>

              <div>
                <span class="text-micro" style="display:block;margin-bottom:4px;">Meal time</span>
                <div class="segmented" id="meal-time-control">
                  <button class="segmented__btn" aria-pressed="true" data-value="Breakfast">Breakfast</button>
                  <button class="segmented__btn" aria-pressed="false" data-value="Lunch">Lunch</button>
                </div>
              </div>

              <div>
                <span class="text-micro" style="display:block;margin-bottom:4px;">Flavors</span>
                <div class="row gap-8 wrap" id="flavor-control">
                  <button type="button" class="btn flavor-btn" data-flavor="Sweet">Sweet</button>
                  <button type="button" class="btn flavor-btn" data-flavor="Sour">Sour</button>
                  <button type="button" class="btn flavor-btn" data-flavor="Salty">Salty</button>
                  <button type="button" class="btn flavor-btn" data-flavor="Spicy">Spicy</button>
                </div>
              </div>

              <div>
                <label class="text-micro" for="ingredient-input" style="display:block;margin-bottom:4px;">Ingredients</label>
                <input class="input" type="text" id="ingredient-input" placeholder="Type an ingredient and press Enter" />
                <div class="row gap-8 wrap mt-8" id="ingredient-chips"></div>
              </div>

              <div>
                <label class="row gap-8 items-start" style="cursor:pointer;">
                  <input type="checkbox" id="dish-special" />
                  <span class="text-micro">Mark as special dish</span>
                </label>
              </div>
            </div>
          </div>

          <div class="row gap-8 mt-24" style="justify-content: flex-end;">
            <a class="btn" href="dishes.html">Cancel</a>
            <a class="btn btn--primary" href="dishes.html">Save dish</a>
          </div>
        </div>
      </main>
    </div>

    <script src="script.js"></script>
    <script>
      (function () {
        var id = getQueryParam("id");
        var heading = document.getElementById("form-heading");
        var nameInput = document.getElementById("dish-name");
        var categorySelect = document.getElementById("dish-category");
        var mealTimeControl = document.getElementById("meal-time-control");
        var flavorControl = document.getElementById("flavor-control");
        var ingredientInput = document.getElementById("ingredient-input");
        var chipContainer = document.getElementById("ingredient-chips");
        var specialCheckbox = document.getElementById("dish-special");

        if (id) {
          heading.textContent = "Edit dish";
          nameInput.value = "Chicken potato curry";
          categorySelect.value = "Main";
          mealTimeControl.querySelectorAll(".segmented__btn").forEach(function (b) {
            b.setAttribute("aria-pressed", b.getAttribute("data-value") === "Lunch" ? "true" : "false");
          });
          flavorControl.querySelector('[data-flavor="Spicy"]').classList.add("flavor-btn--active");
          ["Chicken", "potato", "tomato", "chili"].forEach(function (ing) {
            addChip(ing);
          });
          specialCheckbox.checked = false;
        }

        flavorControl.addEventListener("click", function (e) {
          var btn = e.target.closest(".flavor-btn");
          if (!btn) return;
          btn.classList.toggle("flavor-btn--active");
        });

        ingredientInput.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            e.preventDefault();
            var val = ingredientInput.value.trim();
            if (val) {
              addChip(val);
              ingredientInput.value = "";
            }
          }
        });

        chipContainer.addEventListener("click", function (e) {
          var removeBtn = e.target.closest(".chip__remove");
          if (removeBtn) {
            removeBtn.parentElement.remove();
          }
        });

        function addChip(text) {
          var chip = document.createElement("span");
          chip.className = "chip";
          chip.innerHTML = text + ' <button type="button" class="chip__remove" aria-label="Remove">&times;</button>';
          chipContainer.appendChild(chip);
        }
      })();
    </script>
  </body>
</html>
